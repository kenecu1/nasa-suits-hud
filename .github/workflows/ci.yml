name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run setup
      - run: npm run check
      # Screenshot baselines are Windows-only (CLAUDE.md, Testing): CI uploads what it rendered.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
